# PROJECT-OWNED. The stack-specific half of the command surface.
#
# Two runtimes on purpose: the deliverable (agent workflow + baseline) is
# TypeScript/Mastra, and the things that measure it (fixture generator,
# evaluation harness, trajectory tooling) are Python. A judge never sees the
# split - `task setup` provisions both and every entry point below is a task.
#
# Conventions inherited from forge:
# - `{{.CLI_ARGS}}` carries the pre-commit file list; a task that ignores it
#   will reformat the whole repo on every commit.
# - the :check variants must not modify files.

version: '3'

vars:
  PY: python3
  # Every run is recorded under results/ by the harness, keyed on variant+seed.
  SEEDS: '{{.SEEDS | default "3"}}'

tasks:
  # === forge hook points ==============================================

  deps:
    desc: Install project dependencies
    cmds:
      - pnpm install --frozen-lockfile
    sources: [package.json, pnpm-lock.yaml]
    generates: ['node_modules/**/*']

  deps:force:
    desc: Reinstall dependencies, ignoring the fingerprint
    cmds:
      - pnpm install

  # The pre-commit hook globs "*", so both tools receive .py, .toml and .yml
  # paths as well. prettier skips those with --ignore-unknown; eslint has no
  # equivalent and errors out, so its file list is filtered to TypeScript.

  format:
    desc: Format code. Paths passed as -- ARG.
    cmds:
      - 'pnpm exec prettier --ignore-unknown --write {{.CLI_ARGS | default "src fixtures"}}'

  format:check:
    desc: Fail if the code is not formatted
    cmds:
      - 'pnpm exec prettier --ignore-unknown --check {{.CLI_ARGS | default "src fixtures"}}'

  lint:
    desc: Lint and autofix. Paths passed as -- ARG.
    cmds:
      - task: eslint
        vars: { FIX: '--fix', PATHS: '{{.CLI_ARGS}}' }

  lint:check:
    desc: Lint without fixing
    cmds:
      - task: eslint
        vars: { FIX: '', PATHS: '{{.CLI_ARGS}}' }

  eslint:
    internal: true
    cmds:
      - |
        set -eu
        if [ -z "{{.PATHS}}" ]; then
          exec pnpm exec eslint {{.FIX}} src fixtures
        fi
        files=$(printf '%s\n' {{.PATHS}} | grep -E '\.ts$' || true)
        [ -z "$files" ] && exit 0
        exec pnpm exec eslint {{.FIX}} $files

  typecheck:
    desc: Type-check the project
    # tsc -p ignores file arguments, so CLI_ARGS is deliberately not forwarded.
    cmds:
      - pnpm exec tsc --noEmit -p tsconfig.json

  test:
    desc: Run the project's tests. Paths passed as -- ARG.
    cmds:
      - 'pnpm exec vitest run {{.CLI_ARGS}}'
      # The harness's own tests live under tools/tests, which forge's
      # test:tools task already runs; this hook covers the TypeScript half.

  dev:
    desc: Run one incident through the agent interactively
    cmds:
      - pnpm exec tsx src/cli.ts {{.CLI_ARGS}}

  clean:
    desc: Remove build artefacts and installed dependencies
    cmds:
      - rm -rf node_modules dist results/*.json

  # === Fixtures =======================================================

  fixtures:
    desc: Regenerate the synthetic incident bundles from their seeds
    # Deterministic: the bundles are committed, and this proves they can be
    # rebuilt byte-for-byte from the seed rather than being hand-edited.
    cmds:
      - pnpm exec tsx fixtures/generate.ts

  fixtures:verify:
    desc: Fail if the committed bundles differ from a fresh generation
    cmds:
      - pnpm exec tsx fixtures/generate.ts --check

  # === Evaluation =====================================================

  baseline:
    desc: 'Run the simple-prompt baseline over every case (task project:baseline)'
    cmds:
      - '{{.PY}} harness/run.py --variant baseline --seeds {{.SEEDS}}
        --cmd "pnpm exec tsx src/baseline/run.ts"'

  agent:
    desc: Run the agent workflow over every case
    cmds:
      - '{{.PY}} harness/run.py --variant agent --seeds {{.SEEDS}}
        --cmd "pnpm exec tsx src/agent/run.ts"'

  ablate:
    desc: Measure each workflow feature on its own by disabling it
    # Same repeat count as the headline runs. A single-seed ablation cannot show
    # that a delta is larger than run-to-run noise, which is the only thing the
    # attribution is claiming.
    vars:
      RUN: '{{.PY}} harness/run.py --seeds {{.SEEDS}} --cmd "pnpm exec tsx src/agent/run.ts"'
    cmds:
      - AGENT_FEATURES=search,verify {{.RUN}} --variant agent-notriage
      - AGENT_FEATURES=triage,verify {{.RUN}} --variant agent-nosearch
      - AGENT_FEATURES=triage,search {{.RUN}} --variant agent-noverify

  ablate:noverify:
    desc: Re-run just the verifier ablation
    cmds:
      - AGENT_FEATURES=triage,search {{.PY}} harness/run.py --variant agent-noverify
        --seeds 1 --cmd "pnpm exec tsx src/agent/run.ts"

  eval:
    desc: Run both variants over the same cases
    cmds:
      - task: baseline
      - task: agent
      - task: report

  report:
    desc: Regenerate docs/RESULTS.md from the recorded runs
    cmds:
      - '{{.PY}} harness/compare.py --out docs/RESULTS.md'

  repro:
    desc: Clone HEAD to a scratch dir and reproduce the committed results
    cmds:
      - ./tools/repro/verify.sh

  # === Trajectories ===================================================

  trajectories:
    desc: Mirror the agent session logs into trajectories/raw
    cmds:
      - ./tools/trajectory/capture.sh

  trajectories:redact:
    desc: Redact credentials from the captured logs into trajectories/redacted
    cmds:
      - task: trajectories
      - '{{.PY}} -m tools.trajectory.redact'

  trajectories:verify:
    desc: Fail if any credential survives redaction
    cmds:
      - '{{.PY}} -m tools.trajectory.redact --check'
